name: Dependency audit
on:
  push:
    paths: [uv.lock, pyproject.toml, deploy/export_audit_requirements.py, .github/workflows/security.yml]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
      - run: python deploy/export_audit_requirements.py --output audit-requirements.txt
      # No ignored advisories: unresolved ecdsa timing risk remains visible as failure.
      # Direct Git/wheel sources require the documented manual source review too.
      - run: uv tool run --python 3.13 --no-python-downloads pip-audit --disable-pip --no-deps -r audit-requirements.txt
