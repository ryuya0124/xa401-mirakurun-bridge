[package]
name = "xa401-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native XA401 receiver and Mirakurun-compatible bridge"

[dependencies]
anyhow = "1"
arib = { version = "0.3.0", default-features = false, features = ["text"] }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
