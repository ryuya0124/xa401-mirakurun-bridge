<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>XA401 録画管理</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px system-ui;
      background: #171312;
      color: #f4ede8;
    }
    body {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }
    a {
      color: #f6a9cb;
    }
    h1 {
      font-size: 1.6rem;
    }
    section {
      background: #2b211e;
      padding: 20px;
      border-radius: 14px;
      margin: 18px 0;
    }
    label {
      display: block;
      margin: 14px 0 5px;
    }
    input,
    select,
    button {
      font: inherit;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #76635b;
      border-radius: 8px;
    }
    input,
    select {
      width: 100%;
      background: #1d1715;
      color: inherit;
    }
    button {
      background: #a52c61;
      color: white;
      cursor: pointer;
      margin: 8px 8px 0 0;
    }
    button:disabled {
      opacity: 0.5;
    }
    .card {
      border-top: 1px solid #66514a;
      padding: 14px 0;
    }
    .muted {
      color: #c2afa4;
      font-size: 0.9rem;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .row > * {
      flex: 1;
    }
    #message {
      white-space: pre-wrap;
    }
    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .row {
        display: block;
      }
      section {
        padding: 15px;
      }
    }
  </style>
  <h1>XA401 録画管理</h1>
  <nav>
    <a href="/api/xa401/original">テレビ視聴</a><a href="/videos/">KonomiTVの録画一覧</a
    ><a href="#jobs">PCの録画・予約</a>
  </nav>
  <p class="muted">
    放送のPC録画・予約と、XA401内の録画の直接再生を利用できます。
  </p>
  <p id="message" role="status"></p>
  <section>
    <h2>放送をPCに録画</h2>
    <form id="live">
      <label for="channel">チャンネル</label
      ><select id="channel" required></select>
      <label for="title">保存名</label><input id="title" maxlength="200" />
      <div class="row">
        <div>
          <label for="when">開始日時（空欄なら今すぐ）</label
          ><input id="when" type="datetime-local" />
        </div>
        <div>
          <label for="minutes">録画時間（分）</label
          ><input
            id="minutes"
            type="number"
            min="1"
            max="1440"
            value="30"
            required
          />
        </div>
      </div>
      <button type="submit">録画・予約する</button>
    </form>
    <p class="muted">
      日時指定の予約です。週間番組表や放送延長の自動追従は未対応です。PCとBridgeの起動が必要です。
    </p>
  </section>
  <section id="playback" hidden>
    <h2 id="playing-title">XA401から直接再生</h2>
    <video id="video" controls playsinline style="width: 100%"></video>
    <label for="position">再生開始位置（分）</label
    ><input id="position" type="number" min="0" value="0" step="0.5" />
    <button id="seek">指定位置から再生</button
    ><button id="stop-player">再生を終了</button>
    <p class="muted">
      XA401から直接読み出します。PCへの事前保存やサーバー側の再圧縮は行いません。ブラウザー内で表示用の変換を行います。
    </p>
  </section>
  <section>
    <h2>XA401に録画済みの番組</h2>
    <button id="load-recorded">一覧を読み込む</button>
    <div id="recorded"></div>
  </section>
  <section id="jobs">
    <h2>PCの録画・予約</h2>
    <div id="job-list"></div>
  </section>
  <script type="module" src="/xa401/recordings.js"></script>
</html>
